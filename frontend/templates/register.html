{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Create an account</h1>
    <p class="lede">Choose the role that matches what you'll be doing here.</p>
    <form method="POST">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required autofocus>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label>I am a...</label>
      <div class="role-toggle">
        <label class="role-option">
          <input type="radio" name="role" value="student" checked>
          <span>
            <strong>Student</strong>
            <small>Submit code, see only your own results</small>
          </span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="teacher">
          <span>
            <strong>Teacher</strong>
            <small>Create assignments, grade, run plagiarism checks</small>
          </span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Create account</button>
    </form>
    <p class="lede auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
