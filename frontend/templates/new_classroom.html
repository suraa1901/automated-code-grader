{% extends "base.html" %}
{% block title %}New classroom{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>New classroom</h1>
    <p class="lede">Students join with a code you'll get after creating it.</p>
  </div>
</div>

<form method="POST" class="card" style="max-width:480px;">
  <label for="name">Classroom name</label>
  <input type="text" id="name" name="name" required placeholder="e.g. CSE-B Programming Lab" autofocus>
  <button type="submit" class="btn btn-primary">Create classroom</button>
</form>
{% endblock %}
